<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC Social Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#fdf6ee;
  --surface:#fff9f2;
  --surface2:#f0e8dc;
  --surface3:#e8ddd0;
  --border:#e8ddd0;
  --border2:#d4c4b0;
  --text:#2d1e0f;
  --text2:#7a5c3e;
  --text3:#b8987a;
  --coral:#e8720a;
  --coral-dim:rgba(232,114,10,0.1);
  --coral-bright:#f08030;
  --green:#2a7a3a;
  --green-dim:rgba(42,122,58,0.1);
  --red:#c0392b;
  --red-dim:rgba(192,57,43,0.1);
  --amber:#c87a00;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;min-height:100vh;line-height:1.6}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(253,246,238,0.96);backdrop-filter:blur(12px);z-index:100}
.header-brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:15px;font-style:italic;color:var(--coral);flex-shrink:0}
.brand-name{font-family:'Instrument Serif',serif;font-size:18px;color:var(--text);letter-spacing:-0.01em;line-height:1}
.brand-sub{font-size:10px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;margin-top:1px}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:10px;color:var(--text2);font-weight:500}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--text3)}
.status-dot.ok{background:var(--green)}
.status-dot.loading{background:var(--coral);animation:pulse 1.2s ease-in-out infinite}
.status-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.app-layout{display:flex;min-height:calc(100vh - 57px)}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding:22px 0;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;background:var(--surface)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sidebar-section{margin-bottom:26px}
.sidebar-label{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;padding:0 18px;margin-bottom:8px}
.sidebar-content{padding:0 14px}
.profile-item{display:flex;align-items:center;gap:9px;padding:7px 18px;border-left:2px solid transparent;transition:all 0.15s}
.profile-item.active{background:var(--coral-dim);border-left-color:var(--coral)}
.profile-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.profile-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.profile-network{font-size:10px;color:var(--text3)}
.ctrl-select{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer;margin-bottom:8px;transition:border-color 0.15s}
.ctrl-select:focus{border-color:var(--coral)}
.run-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;letter-spacing:-0.01em}
.run-btn:hover{background:var(--coral);color:#fff;transform:translateY(-1px)}
.run-btn:active{transform:translateY(0)}
.run-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

.content{flex:1;padding:26px 32px;min-width:0}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;text-align:center}
.empty-title{font-family:'Instrument Serif',serif;font-size:32px;color:var(--text2);margin-bottom:8px;font-style:italic}
.empty-sub{font-size:12px;color:var(--text3)}

.metrics-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.metric-cell{background:var(--surface);padding:16px 18px}
.metric-cell-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
.metric-cell-value{font-family:'Instrument Serif',serif;font-size:28px;color:var(--text);letter-spacing:-0.02em;line-height:1}
.metric-cell-delta{font-size:11px;margin-top:4px;font-weight:500}
.delta-up{color:var(--green)}
.delta-down{color:var(--red)}

.tab-bar{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--border)}
.tab-btn{padding:9px 20px;border:none;background:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--coral);border-bottom-color:var(--coral);font-weight:600}
.tab-pane{display:none}
.tab-pane.active{display:block}

.posts-list{display:flex;flex-direction:column;gap:10px}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;transition:border-color 0.15s}
.post-card:hover{border-color:var(--border2)}
.post-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.net-badge{font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:0.05em;text-transform:uppercase}
.net-fb_instagram_account,.net-instagram{background:var(--coral-dim);color:var(--coral)}
.net-facebook{background:rgba(42,90,180,0.1);color:#2a5ab4}
.net-unknown{background:var(--surface2);color:var(--text3)}
.verdict-badge{font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:0.05em}
.verdict-strong{background:var(--green-dim);color:var(--green)}
.verdict-mid{background:rgba(200,122,0,0.1);color:var(--amber)}
.verdict-weak{background:var(--red-dim);color:var(--red)}
.post-link{font-size:11px;color:var(--coral);text-decoration:none;font-weight:500;transition:opacity 0.15s}
.post-link:hover{opacity:0.7}
.post-rank{font-size:11px;color:var(--text3);margin-left:auto;font-weight:500}
.post-stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{font-size:11px;color:var(--text3)}
.stat span{color:var(--text);font-weight:600}
.stat.hl span{color:var(--coral)}

.platform-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.section-title{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:16px}
.pbar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pbar-label{font-size:11px;color:var(--text2);width:90px;flex-shrink:0;font-weight:500}
.pbar-track{flex:1;background:var(--surface2);border-radius:2px;height:5px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.pbar-val{font-size:12px;color:var(--text);width:55px;text-align:right;font-weight:600}
.pbar-count{font-size:10px;color:var(--text3);width:90px}

.adam-summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.adam-cell{background:var(--surface);padding:14px 16px}
.adam-cell-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.adam-cell-value{font-family:'Instrument Serif',serif;font-size:24px;color:var(--text);letter-spacing:-0.02em}
.adam-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.adam-header>div{flex:1;min-width:120px}
.adam-wrap{overflow-x:auto}
.adam-table{width:100%;border-collapse:collapse;font-size:12px}
.adam-table th{padding:9px 13px;border-bottom:1px solid var(--border2);text-align:left;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;white-space:nowrap;font-weight:600;user-select:none}
.adam-table th:hover{color:var(--coral)}
.adam-table th.sorted{color:var(--coral)}
.adam-table td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
.adam-table tr:hover td{background:var(--surface2)}
.adam-pill{display:inline-flex;align-items:center;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap}
.adam-pill.good{background:var(--green-dim);color:var(--green)}
.adam-pill.warn{background:rgba(200,122,0,0.1);color:var(--amber)}
.adam-pill.bad{background:var(--red-dim);color:var(--red)}
.adam-pill.neutral{background:var(--surface2);color:var(--text2)}
.adam-note{font-size:11px;color:var(--text3);margin-top:14px;line-height:1.6;padding:12px 16px;background:var(--surface2);border-radius:var(--r);border-left:3px solid var(--coral)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#dashboard>*{animation:fadeUp 0.25s ease forwards}
</style>
</head>
<body>
<div class="header">
  <div class="header-brand">
    <div class="logo">LC</div>
    <div>
      <div class="brand-name">Social Intel</div>
      <div class="brand-sub">Life.Church &middot; Pattern Engine</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Initializing</span>
  </div>
</div>
<div class="app-layout">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Account</div>
      <div class="sidebar-content">
        <select class="ctrl-select" id="account-select" onchange="selectAccount(this.value)">
          <option value="">-- Select account --</option>
        </select>
        <div id="profile-items"></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Date Range</div>
      <div class="sidebar-content">
        <select class="ctrl-select" id="date-range">
          <option value="30">Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <button class="run-btn" id="run-btn" onclick="runAnalysis()">Run Analysis</button>
      </div>
    </div>
  </div>
  <div class="content">
    <div id="empty-state" class="empty-state">
      <div class="empty-title">No data yet</div>
      <div class="empty-sub">Select an account and click Run Analysis</div>
    </div>
    <div id="dashboard" style="display:none;">
      <div class="metrics-strip" id="metrics-grid"></div>
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('posts',this)">Top Posts</button>
        <button class="tab-btn" onclick="switchTab('patterns',this)">Patterns</button>
        <button class="tab-btn" onclick="switchTab('adam',this)">Adam Metrics</button>
      </div>
      <div id="tab-posts" class="tab-pane active"></div>
      <div id="tab-patterns" class="tab-pane"></div>
      <div id="tab-adam" class="tab-pane"></div>
    </div>
  </div>
</div>
<script>
const SPROUT_TOKEN='NTI4OTg1fDE3NzgxNzc4Nzd8ZTU0YTk4ZGMtOWI0OS00MjUxLThjOTAtZDYzNmFiMTNlNmM4';
let customerId='',allProfiles=[],selectedProfiles=[],adamSortKey='score',adamSortDir='desc',adamRows=[];
function setStatus(msg,state){document.getElementById('status-text').textContent=msg;document.getElementById('status-dot').className='status-dot '+(state||'loading');}
function fmtNum(n){n=Number(n)||0;if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return Math.round(n).toLocaleString();}
function netColor(n){const m={instagram:'#e8720a',fb_instagram_account:'#e8720a',facebook:'#2a5ab4',linkedin:'#2a5ab4'};return m[(n||'').toLowerCase()]||'#b8987a';}
function guidToNet(g){if(!g)return'unknown';if(g.startsWith('igmed:'))return'instagram';if(g.startsWith('p:'))return'facebook';if(g.startsWith('li:'))return'linkedin';if(g.startsWith('yt:'))return'youtube';return'unknown';}
function guidToUrl(g){if(!g)return null;if(g.startsWith('p:')){const parts=g.slice(2).split('_');return parts.length===2?'https://www.facebook.com/'+parts[0]+'/posts/'+parts[1]:null;}return null;}
async function sproutGet(path){const r=await fetch('/api/sprout?path='+encodeURIComponent(path),{headers:{'x-sprout-token':SPROUT_TOKEN}});if(!r.ok){const t=await r.text();throw new Error(r.status+': '+t.slice(0,200));}return r.json();}
async function sproutPost(path,body){const r=await fetch('/api/sprout?path='+encodeURIComponent(path),{method:'POST',headers:{'Content-Type':'application/json','x-sprout-token':SPROUT_TOKEN},body:JSON.stringify(body)});if(!r.ok){const t=await r.text();throw new Error(r.status+': '+t.slice(0,200));}return r.json();}
function renderSidebar(){
  const netLabel={instagram:'IG',fb_instagram_account:'IG',facebook:'FB',linkedin:'LI',youtube:'YT',tiktok:'TK'};
  const EXCLUDED=['twitter','fb_twitter_account','linkedin','youtube'];
  const profiles=allProfiles.filter(p=>!EXCLUDED.includes((p.network_type||'').toLowerCase()));
  const groups={};
  profiles.forEach(p=>{const key=p.name||p.handle||'Unknown';if(!groups[key])groups[key]=[];groups[key].push(p);});
  window._profileGroups=groups;window._allFilteredProfiles=profiles;window._netLabel=netLabel;
  selectedProfiles=[];
  const accountNames=Object.keys(groups);
  let opts='<option value="">-- Select account --</option><option value="all">All accounts</option>';
  accountNames.forEach(name=>{
    const profs=groups[name];
    if(profs.length===1){opts+='<option value="grp:'+name+'">'+name+'</option>';}
    else{
      opts+='<optgroup label="'+name+'">';
      opts+='<option value="grp:'+name+'">'+name+' - All</option>';
      profs.forEach(p=>{const net=(p.network_type||'').toLowerCase();opts+='<option value="pid:'+p.customer_profile_id+'">'+name+' - '+(netLabel[net]||net)+'</option>';});
      opts+='</optgroup>';
    }
  });
  document.getElementById('account-select').innerHTML=opts;
}
function selectAccount(val){
  const netLabel=window._netLabel||{};
  const allFiltered=window._allFilteredProfiles||[];
  let selected=[];
  if(val==='all'){selected=allFiltered;}
  else if(val.startsWith('grp:')){selected=(window._profileGroups||{})[val.slice(4)]||[];}
  else if(val.startsWith('pid:')){const id=parseInt(val.slice(4));selected=allFiltered.filter(p=>p.customer_profile_id===id);}
  selectedProfiles=selected.map(p=>p.customer_profile_id);
  document.getElementById('profile-items').innerHTML=selected.map(p=>{
    const net=(p.network_type||'').toLowerCase();
    return '<div class="profile-item active"><div class="profile-icon" style="background:'+netColor(net)+'18;color:'+netColor(net)+';">'+(netLabel[net]||'--')+'</div><div><div class="profile-name">'+(p.name||'Profile')+'</div><div class="profile-network">'+net+'</div></div></div>';
  }).join('');
}
function getDateRange(days){const end=new Date(),start=new Date();start.setDate(start.getDate()-parseInt(days));const fmt=d=>d.toISOString().split('T')[0];return{start:fmt(start),end:fmt(end)};}
async function runAnalysis(){
  if(!selectedProfiles.length){alert('Please select an account first.');return;}
  const btn=document.getElementById('run-btn');
  btn.disabled=true;btn.textContent='Running...';
  const days=document.getElementById('date-range').value;
  const{start,end}=getDateRange(days);
  try{
    setStatus('Fetching analytics...','loading');
    const postRes=await sproutPost('/v1/'+customerId+'/analytics/posts',{
      filters:['customer_profile_id.eq('+selectedProfiles.join(',')+')', 'created_time.in('+start+'..'+end+')'],
      metrics:['lifetime.impressions','lifetime.engagements','lifetime.reactions','lifetime.shares_count','lifetime.comments_count'],
      page_size:100
    });
    const posts=postRes.data||[];
    setStatus('Analyzing '+posts.length+' posts...','loading');
    renderMetrics(posts);renderPosts(posts);renderPatterns(posts);renderAdamTab(posts);
    document.getElementById('dashboard').style.display='block';
    document.getElementById('empty-state').style.display='none';
    setStatus(posts.length+' posts &middot; '+days+' days','ok');
  }catch(e){setStatus('Error: '+e.message,'error');}
  finally{btn.disabled=false;btn.textContent='Run Analysis';}
}
function renderMetrics(posts){
  const totalImp=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.impressions']||0),0);
  const totalEng=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.engagements']||0),0);
  const avgEng=posts.length?Math.round(totalEng/posts.length):0;
  const avgER=totalImp>0?((totalEng/totalImp)*100).toFixed(2):0;
  document.getElementById('metrics-grid').innerHTML=[
    ['Impressions',fmtNum(totalImp),''],
    ['Engagements',fmtNum(totalEng),''],
    ['Avg Eng/Post',fmtNum(avgEng),''],
    ['Eng Rate',avgER+'%',''],
    ['Posts',posts.length,'']
  ].map(([l,v,d])=>'<div class="metric-cell"><div class="metric-cell-label">'+l+'</div><div class="metric-cell-value">'+v+'</div></div>').join('');
}
function renderPosts(posts){
  if(!posts.length){document.getElementById('tab-posts').innerHTML='<div class="empty-state" style="height:200px"><div class="empty-title">No posts found</div></div>';return;}
  const sorted=[...posts].sort((a,b)=>(b.metrics?.['lifetime.engagements']||0)-(a.metrics?.['lifetime.engagements']||0));
  const median=sorted[Math.floor(sorted.length/2)]?.metrics?.['lifetime.engagements']||0;
  document.getElementById('tab-posts').innerHTML='<div class="posts-list">'+sorted.slice(0,20).map((p,i)=>{
    const eng=p.metrics?.['lifetime.engagements']||0,imp=p.metrics?.['lifetime.impressions']||0;
    const er=imp>0?((eng/imp)*100).toFixed(2):'0.00';
    const verdict=eng>median*1.5?'strong':eng<median*0.5?'weak':'mid';
    const vLabel=verdict==='strong'?'Top Performer':verdict==='weak'?'Underperformer':'Average';
    const net=guidToNet(p.guid);const url=guidToUrl(p.guid);
    return '<div class="post-card">'+
      '<div class="post-top"><span class="net-badge net-'+net+'">'+net+'</span>'+
      '<span class="verdict-badge verdict-'+verdict+'">'+vLabel+'</span>'+
      (url?'<a href="'+url+'" target="_blank" class="post-link">View post &rarr;</a>':'')+
      '<span class="post-rank">#'+(i+1)+'</span></div>'+
      '<div class="post-stats">'+
      '<div class="stat">Impressions <span>'+fmtNum(imp)+'</span></div>'+
      '<div class="stat">Engagements <span>'+fmtNum(eng)+'</span></div>'+
      '<div class="stat">Reactions <span>'+fmtNum(p.metrics?.['lifetime.reactions']||0)+'</span></div>'+
      '<div class="stat">Comments <span>'+fmtNum(p.metrics?.['lifetime.comments_count']||0)+'</span></div>'+
      '<div class="stat">Shares <span>'+fmtNum(p.metrics?.['lifetime.shares_count']||0)+'</span></div>'+
      '<div class="stat hl">Eng rate <span>'+er+'%</span></div>'+
      '</div></div>';
  }).join('')+'</div>';
}
function renderPatterns(posts){
  if(!posts.length)return;
  const byNet={};
  posts.forEach(p=>{
    const net=guidToNet(p.guid);
    const eng=p.metrics?.['lifetime.engagements']||0,imp=p.metrics?.['lifetime.impressions']||0;
    if(!byNet[net])byNet[net]={t:0,imp:0,reactions:0,shares:0,comments:0,c:0};
    byNet[net].t+=eng;byNet[net].imp+=imp;
    byNet[net].reactions+=p.metrics?.['lifetime.reactions']||0;
    byNet[net].shares+=p.metrics?.['lifetime.shares_count']||0;
    byNet[net].comments+=p.metrics?.['lifetime.comments_count']||0;
    byNet[net].c++;
  });
  const netEntries=Object.entries(byNet).sort((a,b)=>(b[1].t/b[1].c)-(a[1].t/a[1].c));
  const maxAvg=netEntries.length?Math.round(netEntries[0][1].t/netEntries[0][1].c):1;
  document.getElementById('tab-patterns').innerHTML='<div class="platform-section"><div class="section-title">Platform Performance</div>'+
    netEntries.map(([net,d])=>{
      const avg=Math.round(d.t/d.c),pct=Math.round((avg/maxAvg)*100);
      const er=d.imp>0?((d.t/d.imp)*100).toFixed(2):0;
      return '<div class="pbar-row"><div class="pbar-label">'+net+'</div>'+
        '<div class="pbar-track"><div class="pbar-fill" style="width:'+pct+'%;background:'+netColor(net)+';"></div></div>'+
        '<div class="pbar-val">'+fmtNum(avg)+'</div>'+
        '<div class="pbar-count">'+d.c+' posts &middot; '+er+'% ER</div></div>';
    }).join('')+'</div>';
}
function renderAdamTab(posts){
  const igPosts=posts.filter(p=>p.guid&&(p.guid.startsWith('igmed:')||p.guid.startsWith('igm:')));
  adamRows=igPosts.map((p,i)=>{
    const reach=p.metrics?.['lifetime.impressions']||0;
    const sends=p.metrics?.['lifetime.shares_count']||0;
    const likes=p.metrics?.['lifetime.reactions']||0;
    const watchTime=p.metrics?.['lifetime.video_view_time_per_view']||0;
    const sendRate=reach>0?sends/reach:0,likeRate=reach>0?likes/reach:0;
    const score=(sendRate*1000)+(likeRate*250)+(watchTime?Math.min(watchTime,60)/60:0);
    return{idx:i+1,guid:p.guid,reach,sends,sendRate,likes,likeRate,watchTime,score};
  }).filter(r=>r.reach>0);
  const tab=document.getElementById('tab-adam');tab.innerHTML='';
  if(!adamRows.length){tab.innerHTML='<div class="empty-state" style="height:200px"><div class="empty-title">No Instagram posts</div><div class="empty-sub">Select an Instagram profile</div></div>';return;}
  const summary=document.createElement('div');summary.className='adam-summary-strip';summary.id='adam-summary';tab.appendChild(summary);
  const toolbar=document.createElement('div');toolbar.className='adam-header';
  toolbar.innerHTML='<div><select class="ctrl-select" id="adam-type-filter" style="margin-bottom:0"><option value="">All types</option><option value="video">Video / Reel</option><option value="photo">Photo / Static</option></select></div>'+
    '<div><input class="ctrl-select" id="adam-min-reach" type="number" placeholder="Min reach..." style="margin-bottom:0;padding:7px 10px;"></div>';
  tab.appendChild(toolbar);
  const wrap=document.createElement('div');wrap.className='adam-wrap';
  const table=document.createElement('table');table.className='adam-table';
  const thead=document.createElement('thead');const hr=document.createElement('tr');
  [['idx','Post'],['reach','Reach'],['sends','Sends'],['sendRate','Sends/Reach'],['likes','Likes'],['likeRate','Likes/Reach'],['watchTime','Watch Time'],['score','Signal Score']].forEach(([key,label])=>{
    const th=document.createElement('th');th.textContent=label;th.dataset.key=key;
    if(key===adamSortKey)th.classList.add('sorted');
    th.onclick=()=>adamSort(key);hr.appendChild(th);
  });
  thead.appendChild(hr);table.appendChild(thead);
  const tbody=document.createElement('tbody');tbody.id='adam-tbody';table.appendChild(tbody);
  wrap.appendChild(table);tab.appendChild(wrap);
  const note=document.createElement('div');note.className='adam-note';
  note.textContent='Signal Score: sends/reach x1000 + likes/reach x250 + watch time contribution. Based on Adam Mosseri stated Instagram distribution signals.';
  tab.appendChild(note);
  document.getElementById('adam-type-filter').addEventListener('change',renderAdamTable);
  document.getElementById('adam-min-reach').addEventListener('input',renderAdamTable);
  renderAdamSummary();renderAdamTable();
}
function renderAdamSummary(){
  const el=document.getElementById('adam-summary');if(!el)return;
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const avgSend=avg(adamRows.map(r=>r.sendRate)),avgLike=avg(adamRows.map(r=>r.likeRate));
  const watchRows=adamRows.filter(r=>r.watchTime>0),avgWatch=avg(watchRows.map(r=>r.watchTime));
  el.innerHTML=[['IG Posts',adamRows.length],['Avg Sends/Reach',(avgSend*100).toFixed(2)+'%'],['Avg Likes/Reach',(avgLike*100).toFixed(2)+'%'],['Avg Watch Time',watchRows.length?timeFmt(avgWatch):'--']]
    .map(([l,v])=>'<div class="adam-cell"><div class="adam-cell-label">'+l+'</div><div class="adam-cell-value">'+v+'</div></div>').join('');
}
function timeFmt(s){if(!s||s<=0)return'--';if(s<60)return s.toFixed(1)+'s';const m=Math.floor(s/60),sec=Math.round(s%60);return m+':'+(sec<10?'0':'')+sec;}
function adamSort(key){
  if(adamSortKey===key)adamSortDir=adamSortDir==='asc'?'desc':'asc';
  else{adamSortKey=key;adamSortDir='desc';}
  document.querySelectorAll('.adam-table th').forEach(th=>th.classList.toggle('sorted',th.dataset.key===key));
  renderAdamTable();
}
function renderAdamTable(){
  const tbody=document.getElementById('adam-tbody');if(!tbody)return;
  const minReach=parseFloat(document.getElementById('adam-min-reach')?.value||0)||0;
  const typeFilter=document.getElementById('adam-type-filter')?.value||'';
  let data=[...adamRows].filter(r=>r.reach>=minReach);
  if(typeFilter==='video')data=data.filter(r=>r.watchTime>0);
  if(typeFilter==='photo')data=data.filter(r=>r.watchTime===0);
  data.sort((a,b)=>adamSortDir==='asc'?a[adamSortKey]-b[adamSortKey]:b[adamSortKey]-a[adamSortKey]);
  if(!data.length){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--text3);">No posts match filters</td></tr>';return;}
  const pillClass=(rate,kind)=>{if(kind==='send')return rate>=0.01?'good':rate>=0.004?'warn':'bad';return rate>=0.04?'good':rate>=0.02?'warn':'bad';};
  const pct=r=>(r*100).toFixed(2)+'%';
  tbody.innerHTML=data.map(r=>{
    const url=guidToUrl(r.guid);
    return '<tr>'+
      '<td style="font-size:12px;font-weight:500;">Post #'+r.idx+'<br>'+(url?'<a href="'+url+'" target="_blank" class="post-link" style="font-size:10px;">View &rarr;</a>':'<span style="font-size:10px;color:var(--text3);">'+r.guid.slice(0,20)+'...</span>')+'</td>'+
      '<td>'+fmtNum(r.reach)+'</td>'+
      '<td>'+fmtNum(r.sends)+'</td>'+
      '<td><span class="adam-pill '+pillClass(r.sendRate,'send')+'">'+pct(r.sendRate)+'</span></td>'+
      '<td>'+fmtNum(r.likes)+'</td>'+
      '<td><span class="adam-pill '+pillClass(r.likeRate,'like')+'">'+pct(r.likeRate)+'</span></td>'+
      '<td>'+(r.watchTime>0?timeFmt(r.watchTime):'--')+'</td>'+
      '<td><span class="adam-pill neutral">'+r.score.toFixed(2)+'</span></td>'+
      '</tr>';
  }).join('');
}
function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');document.getElementById('tab-'+name).classList.add('active');
}
document.addEventListener('DOMContentLoaded',async()=>{
  setStatus('Loading profiles...','loading');
  try{
    const cd=await sproutGet('/v1/metadata/client');
    customerId=(cd.data&&cd.data[0])?String(cd.data[0].customer_id):'';
    const pd=await sproutGet('/v1/'+customerId+'/metadata/customer');
    allProfiles=pd.data||[];
    renderSidebar();
    setStatus(allProfiles.length+' profiles loaded','ok');
  }catch(e){setStatus('Connection error','error');}
});
</script>
</body>
</html>
