<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTJ - Life.Church Social Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0d0f12;
    --surface: #141720;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #565b6e;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.1);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.1);
    --red: #f06060;
    --red-dim: rgba(240,96,96,0.1);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.1);
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; min-height: 100vh; line-height: 1.6; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(13,15,18,0.92); backdrop-filter: blur(12px); z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 17px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .header-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }
  .header-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
  .status-pill { display: flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 11px; color: var(--text2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); transition: background 0.3s; }
  .status-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.loading { background: var(--amber); animation: blink 1s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* SETUP */
  .setup-screen { max-width: 520px; margin: 80px auto; padding: 0 24px; }
  .setup-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 36px; }
  .setup-heading { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--text); margin-bottom: 8px; letter-spacing: -0.02em; }
  .setup-sub { color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 28px; }
  .field-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 7px; }
  .token-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); padding: 11px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; outline: none; transition: border 0.2s; margin-bottom: 16px; }
  .token-input:focus { border-color: var(--accent); }
  .connect-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 12px; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.02em; }
  .connect-btn:hover { opacity: 0.85; }
  .connect-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-box { background: var(--red-dim); border: 1px solid rgba(240,96,96,0.25); border-radius: var(--radius); padding: 12px 14px; color: var(--red); font-size: 12px; margin-top: 14px; display: none; }

  /* LAYOUT */
  .app { display: none; }
  .main { display: flex; min-height: calc(100vh - 65px); }

  /* SIDEBAR */
  .sidebar { width: 230px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 22px 0; position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto; }
  .sidebar-section { margin-bottom: 26px; }
  .sidebar-label { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 18px; margin-bottom: 8px; }
  .profile-item { display: flex; align-items: center; gap: 9px; padding: 7px 18px; cursor: pointer; transition: background 0.15s; border-left: 2px solid transparent; }
  .profile-item:hover { background: var(--surface); }
  .profile-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
  .profile-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .profile-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile-network { font-size: 10px; color: var(--text3); }
  .range-group { padding: 0 18px; }
  .range-select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; outline: none; cursor: pointer; margin-bottom: 10px; }
  .run-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; letter-spacing: 0.02em; }
  .run-btn:hover { opacity: 0.85; }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* CONTENT */
  .content { flex: 1; padding: 26px 30px; min-width: 0; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
  .metric-value { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--surface); border-radius: var(--radius); padding: 4px; width: fit-content; }
  .tab-btn { padding: 6px 16px; border: none; background: none; color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; border-radius: 7px; transition: all 0.15s; letter-spacing: 0.02em; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .tab-btn:hover:not(.active) { color: var(--text); background: var(--surface2); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* POSTS */
  .posts-list { display: flex; flex-direction: column; gap: 10px; }
  .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: border 0.2s; }
  .post-card:hover { border-color: var(--border2); }
  .post-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .net-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  .net-instagram { background: rgba(245,166,35,0.15); color: var(--amber); }
  .net-facebook { background: rgba(79,142,247,0.15); color: var(--accent); }
  .net-twitter { background: rgba(79,142,247,0.12); color: #60a5f5; }
  .net-linkedin { background: rgba(79,142,247,0.15); color: var(--accent); }
  .net-youtube { background: rgba(240,96,96,0.12); color: var(--red); }
  .net-unknown { background: var(--surface2); color: var(--text3); }
  .verdict-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .verdict-strong { background: var(--green-dim); color: var(--green); }
  .verdict-mid { background: var(--amber-dim); color: var(--amber); }
  .verdict-weak { background: var(--red-dim); color: var(--red); }
  .post-date { font-size: 11px; color: var(--text3); margin-left: auto; }
  .post-text { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; border-left: 2px solid var(--border2); padding-left: 12px; }
  .post-stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--text3); }
  .stat span { color: var(--text); font-weight: 500; }
  .stat.highlight span { color: var(--accent); }

  /* CHARTS */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 860px) { .charts-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .chart-title { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
  .platform-bars { display: flex; flex-direction: column; gap: 10px; }
  .pbar-row { display: flex; align-items: center; gap: 10px; }
  .pbar-label { font-size: 11px; color: var(--text2); width: 80px; flex-shrink: 0; }
  .pbar-track { flex: 1; background: var(--surface2); border-radius: 3px; height: 6px; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .pbar-val { font-size: 11px; color: var(--text); width: 50px; text-align: right; }
  .pbar-count { font-size: 10px; color: var(--text3); }

  /* INSIGHTS */
  .insights-list { display: flex; flex-direction: column; gap: 10px; }
  .insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .insight-type { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; margin-top: 2px; }
  .type-strength { background: var(--green-dim); color: var(--green); }
  .type-weakness { background: var(--red-dim); color: var(--red); }
  .type-opportunity { background: var(--amber-dim); color: var(--amber); }
  .type-pattern { background: var(--purple-dim); color: var(--purple); }
  .insight-text { font-size: 13px; color: var(--text2); line-height: 1.65; }
  .insights-loading { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; color: var(--text3); font-size: 12px; text-align: center; }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }
  .empty-title { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text2); margin-bottom: 8px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div style="text-align:center;padding:28px;border-bottom:1px solid var(--border);">
    <div style="display:inline-flex;align-items:center;gap:12px;">
      <div class="logo-mark">L</div>
      <div>
        <div class="header-title">INTJ - Life.Church Social Intel</div>
        <div class="header-sub">Powered by Sprout Social</div>
      </div>
    </div>
  </div>
  <div class="setup-screen">
    <div class="setup-card">
      <div class="setup-heading">Connect your account</div>
      <div class="setup-sub">Enter your Sprout Social API token. It is never stored or logged.</div>
      <div class="field-label">Sprout API Token</div>
      <input type="password" class="token-input" id="token-input" placeholder="Paste your bearer token..." />
      <button class="connect-btn" id="connect-btn" onclick="connect()">Connect to Sprout Social</button>
      <div class="error-box" id="setup-error"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="logo-mark">L</div>
      <div>
        <div class="header-title">INTJ - Life.Church Social Intel</div>
        <div class="header-sub">Pattern Analysis Engine</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Profiles</div>
        <div id="profiles-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Date Range</div>
        <div class="range-group">
          <select class="range-select" id="date-range">
            <option value="30">Last 30 days</option>
            <option value="60">Last 60 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <button class="run-btn" id="run-btn" onclick="runAnalysis()">Run analysis</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="empty-state" class="empty">
        <div class="empty-title">No data yet</div>
        Select profiles and click run analysis
      </div>
      <div id="dashboard" style="display:none;">
        <div class="metrics-grid" id="metrics-grid"></div>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('posts',this)">Top posts</button>
          <button class="tab-btn" onclick="switchTab('patterns',this)">Patterns</button>
          <button class="tab-btn" onclick="switchTab('insights',this)">INTJ verdict</button>
        </div>
        <div id="tab-posts" class="tab-panel active"></div>
        <div id="tab-patterns" class="tab-panel"></div>
        <div id="tab-insights" class="tab-panel"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // All Sprout API calls go through /api/sprout?path=... (our Vercel proxy)
  let token = 'NTI4OTg1fDE3NzgxNzc4Nzd8ZTU0YTk4ZGMtOWI0OS00MjUxLThjOTAtZDYzNmFiMTNlNmM4';
  let customerId = '';
  let selectedProfiles = [];
  let allProfiles = [];
  let dayChart = null, hourChart = null;

  function setStatus(msg, state='loading') {
    document.getElementById('status-text').textContent = msg;
    document.getElementById('status-dot').className = 'status-dot ' + state;
  }

  function fmtNum(n) {
    n = Number(n)||0;
    if (n>=1000000) return (n/1000000).toFixed(1)+'M';
    if (n>=1000) return (n/1000).toFixed(1)+'K';
    return Math.round(n).toLocaleString();
  }

  function netColor(n) {
    const m={instagram:'#f5a623',facebook:'#4f8ef7',twitter:'#60a5f5',linkedin:'#4f8ef7',youtube:'#f06060'};
    return m[(n||'').toLowerCase()]||'#8b90a0';
  }

  async function sproutGet(path) {
    const r = await fetch(`/api/sprout?path=${encodeURIComponent(path)}`, {
      headers: { 'x-sprout-token': token }
    });
    if (!r.ok) { const t=await r.text(); throw new Error(`${r.status}: ${t.slice(0,200)}`); }
    return r.json();
  }

  async function sproutPost(path, body) {
    const fullPath = customerId ? path.replace('/v1/', `/v1/${customerId}/`) : path;
    const r = await fetch(`/api/sprout?path=${encodeURIComponent(fullPath)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-sprout-token': token },
      body: JSON.stringify(body)
    });
    if (!r.ok) { const t=await r.text(); throw new Error(`${r.status}: ${t.slice(0,200)}`); }
    return r.json();
  }

  async function connect() {
    const input = document.getElementById('token-input');
    token = input.value.trim() || token;
    if (!token) return;
    const btn = document.getElementById('connect-btn');
    btn.disabled = true; btn.textContent = 'Connecting...';
    document.getElementById('setup-error').style.display = 'none';
    try {
      const data = await sproutGet('/v1/metadata/client');
      customerId = (data.data && data.data[0]) ? String(data.data[0].customer_id) : '';
      const pData = await sproutGet('/v1/' + customerId + '/metadata/customer');
      allProfiles = pData.data || [];
      if (!allProfiles.length) throw new Error('No profiles found on this account.');
      document.getElementById('setup').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderSidebar();
      setStatus(`${allProfiles.length} profiles loaded`, 'ok');
    } catch(e) {
      document.getElementById('setup-error').style.display = 'block';
      document.getElementById('setup-error').textContent = 'Connection failed: ' + e.message;
      btn.disabled = false; btn.textContent = 'Connect to Sprout Social';
    }
  }

  function renderSidebar() {
    const netLabel={instagram:'IG',facebook:'FB',linkedin:'LI',youtube:'YT',tiktok:'TK',fb_instagram_account:'IG'};
    const profiles = allProfiles.filter(p => !['twitter','fb_twitter_account'].includes((p.network_type||'').toLowerCase()));
    const groups = {};
    profiles.forEach(p => {
      const key = p.name || p.handle || 'Unknown';
      if (!groups[key]) groups[key] = [];
      groups[key].push(p);
    });
    window._profileGroups = groups;
    window._netLabel = netLabel;
    const accountNames = Object.keys(groups);
    // Start with nothing selected
    selectedProfiles = [];
    document.getElementById('profiles-list').innerHTML = `
      <div class="range-group" style="margin-bottom:10px;">
        <select class="range-select" id="account-select" onchange="selectAccount(this.value)">
          <option value="">-- Pick an account --</option>
          <option value="all">All accounts</option>
          ${accountNames.map(n => `<option value="${n}">${n}</option>`).join('')}
        </select>
      </div>
      <div id="profile-items"></div>`;
  }

  function selectAccount(name) {
    const netLabel = window._netLabel || {};
    const profiles = allProfiles.filter(p => !['twitter','fb_twitter_account'].includes((p.network_type||'').toLowerCase()));
    let selected = [];
    if (name === 'all') {
      selected = profiles;
    } else if (name) {
      selected = (window._profileGroups||{})[name] || [];
    }
    selectedProfiles = selected.map(p => p.customer_profile_id);
    document.getElementById('profile-items').innerHTML = selected.map(p => {
      const net = (p.network_type||'').toLowerCase();
      return `<div class="profile-item active" data-id="${p.customer_profile_id}">
        <div class="profile-icon" style="background:${netColor(net)}22;">${netLabel[net]||'--'}</div>
        <div>
          <div class="profile-name">${p.name||p.handle||'Profile'}</div>
          <div class="profile-network">${net}</div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleProfile(el, id) {
    if (selectedProfiles.includes(id)) {
      if (selectedProfiles.length===1) return;
      selectedProfiles = selectedProfiles.filter(p=>p!==id);
      el.classList.remove('active');
    } else {
      selectedProfiles.push(id);
      el.classList.add('active');
    }
  }

  function getDateRange(days) {
    const end=new Date(), start=new Date();
    start.setDate(start.getDate()-parseInt(days));
    const fmt=d=>d.toISOString().replace('T',' ').replace(/\.\d+Z$/,'+0000');
    return {start:fmt(start),end:fmt(end)};
  }

  async function runAnalysis() {
    if (!selectedProfiles.length) return;
    const btn=document.getElementById('run-btn');
    btn.disabled=true; btn.textContent='Running...';
    const days=document.getElementById('date-range').value;
    const {start,end}=getDateRange(days);
    try {
      setStatus('Fetching post analytics...','loading');
      const postRes = await sproutPost('/v1/analytics/posts', {
        filters: [
          'customer_profile_id.eq(' + selectedProfiles.join(',') + ')',
          'created_time.in(' + start.split(' ')[0] + '..' + end.split(' ')[0] + ')'
        ],
        metrics:['lifetime.impressions','lifetime.engagements','lifetime.reactions','lifetime.shares_count','lifetime.comments_count','lifetime.post_link_clicks'],
        page_size:100
      });
      const posts=postRes.data||[];
      setStatus(`Analyzing ${posts.length} posts...`,'loading');
      renderMetrics(posts);
      renderPosts(posts);
      renderPatterns(posts);
      document.getElementById('dashboard').style.display='block';
      document.getElementById('empty-state').style.display='none';
      await generateInsights(posts, days);
      setStatus(`Done ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ ${posts.length} posts analyzed`,'ok');
    } catch(e) {
      setStatus('Error: '+e.message,'error');
    } finally {
      btn.disabled=false; btn.textContent='Run analysis
    }
  }

  function renderMetrics(posts) {
    const totalImp=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.impressions']||0),0);
    const totalEng=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.engagements']||0),0);
    const totalReach=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.impressions']||0),0);
    const avgEng=posts.length?Math.round(totalEng/posts.length):0;
    const avgER=totalImp>0?((totalEng/totalImp)*100).toFixed(2):'0.00';
    document.getElementById('metrics-grid').innerHTML=[
      ['Impressions',fmtNum(totalImp)],
      ['Engagements',fmtNum(totalEng)],
      ['Avg eng/post',fmtNum(avgEng)],
      ['Eng rate',avgER+'%'],
      ['Total reach',fmtNum(totalReach)],
      ['Posts analyzed',posts.length],
    ].map(([l,v])=>`<div class="metric-card"><div class="metric-label">${l}</div><div class="metric-value">${v}</div></div>`).join('');
  }

  function renderPosts(posts) {
    if (!posts.length) { document.getElementById('tab-posts').innerHTML='<div class="empty"><div class="empty-title">No posts found</div>Try a wider date range.</div>'; return; }
    const sorted=[...posts].sort((a,b)=>(b.metrics?.engagements||0)-(a.metrics?.engagements||0));
    const median=sorted[Math.floor(sorted.length/2)]?.metrics?.engagements||0;
    document.getElementById('tab-posts').innerHTML='<div class="posts-list">'+sorted.slice(0,20).map(p=>{
      const eng=p.metrics?.['lifetime.engagements']||0,imp=p.metrics?.['lifetime.impressions']||0;
      const er=imp>0?((eng/imp)*100).toFixed(2):'0.00';
      const verdict=eng>median*1.5?'strong':eng<median*0.5?'weak':'mid';
      const vLabel=verdict==='strong'?'Top performer':verdict==='weak'?'Underperformer':'Average';
      const net=(p.customer_profile?.network_type||'').toLowerCase();
      const date=p.sent_time?new Date(p.sent_time).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
      const txt=(p.text||'').slice(0,160)+((p.text||'').length>160?'ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¦':'');
      return `<div class="post-card">
        <div class="post-top">
          <span class="net-badge net-${net||'unknown'}">${net||'unknown'}</span>
          <span class="verdict-badge verdict-${verdict}">${vLabel}</span>
          <span class="post-date">${date}</span>
        </div>
        <div class="post-text">${txt||'<em>No text content</em>'}</div>
        <div class="post-stats">
          <div class="stat">impressions <span>${fmtNum(imp)}</span></div>
          <div class="stat">reactions <span>${fmtNum(p.metrics?.reactions||0)}</span></div>
          <div class="stat">comments <span>${fmtNum(p.metrics?.comments||0)}</span></div>
          <div class="stat">shares <span>${fmtNum(p.metrics?.shares||0)}</span></div>
          <div class="stat highlight">eng rate <span>${er}%</span></div>
        </div>
      </div>`;
    }).join('')+'</div>';
  }

  function renderPatterns(posts) {
    if (!posts.length) return;
    const byDay={},byHour={},byNet={};
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    posts.forEach(p=>{
      const eng=p.metrics?.['lifetime.engagements']||0;
      const net=(p.customer_profile?.network_type||'unknown').toLowerCase();
      if (p.sent_time) {
        const d=new Date(p.sent_time);
        const day=days[d.getDay()],hour=d.getHours();
        if(!byDay[day]) byDay[day]={t:0,c:0}; byDay[day].t+=eng; byDay[day].c++;
        if(!byHour[hour]) byHour[hour]={t:0,c:0}; byHour[hour].t+=eng; byHour[hour].c++;
      }
      if(!byNet[net]) byNet[net]={t:0,c:0}; byNet[net].t+=eng; byNet[net].c++;
    });
    const dayAvgs=days.map(d=>byDay[d]?Math.round(byDay[d].t/byDay[d].c):0);
    const hourLabels=Array.from({length:24},(_,h)=>h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p');
    const hourAvgs=Array.from({length:24},(_,h)=>byHour[h]?Math.round(byHour[h].t/byHour[h].c):0);
    const netEntries=Object.entries(byNet).sort((a,b)=>(b[1].t/b[1].c)-(a[1].t/a[1].c));
    const maxNet=netEntries.length?Math.round(netEntries[0][1].t/netEntries[0][1].c):1;

    document.getElementById('tab-patterns').innerHTML=`
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-title">Avg engagement by day</div><div style="position:relative;height:190px;"><canvas id="dayChart"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">Avg engagement by hour posted</div><div style="position:relative;height:190px;"><canvas id="hourChart"></canvas></div></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Performance by platform</div>
        <div class="platform-bars" style="margin-top:10px;">
          ${netEntries.map(([net,d])=>{
            const avg=Math.round(d.t/d.c),pct=Math.round((avg/maxNet)*100);
            return `<div class="pbar-row"><div class="pbar-label">${net}</div><div class="pbar-track"><div class="pbar-fill" style="width:${pct}%;background:${netColor(net)};"></div></div><div class="pbar-val">${fmtNum(avg)}</div><div class="pbar-count">${d.c} posts</div></div>`;
          }).join('')}
        </div>
      </div>`;

    if(dayChart){dayChart.destroy();dayChart=null;}
    if(hourChart){hourChart.destroy();hourChart=null;}
    const chartOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#565b6e',font:{family:"'DM Mono',monospace",size:10}},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#565b6e',font:{family:"'DM Mono',monospace",size:10},callback:v=>fmtNum(v)},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:true}}};
    setTimeout(()=>{
      if(document.getElementById('dayChart')) dayChart=new Chart(document.getElementById('dayChart'),{type:'bar',data:{labels:days,datasets:[{data:dayAvgs,backgroundColor:'rgba(79,142,247,0.7)',borderRadius:4,hoverBackgroundColor:'#4f8ef7'}]},options:chartOpts});
      if(document.getElementById('hourChart')) hourChart=new Chart(document.getElementById('hourChart'),{type:'line',data:{labels:hourLabels,datasets:[{data:hourAvgs,borderColor:'#3ecf8e',backgroundColor:'rgba(62,207,142,0.06)',tension:0.4,fill:true,pointRadius:2}]},options:{...chartOpts,scales:{...chartOpts.scales,x:{...chartOpts.scales.x,ticks:{...chartOpts.scales.x.ticks,maxTicksLimit:8}}}}});
    },50);
  }

  async function generateInsights(posts, days) {
    document.getElementById('tab-insights').innerHTML='<div class="insights-loading">Generating INTJ analysis via Claude...</div>';
    const sorted=[...posts].sort((a,b)=>(b.metrics?.engagements||0)-(a.metrics?.engagements||0));
    const totalEng=posts.reduce((s,p)=>s+(p.metrics?.['lifetime.engagements']||0),0);
    const avgEng=posts.length?Math.round(totalEng/posts.length):0;
    const top5=sorted.slice(0,5).map(p=>({text:(p.text||'').slice(0,100),eng:p.metrics?.['lifetime.engagements']||0,network:p.customer_profile?.network_type,day:p.sent_time?new Date(p.sent_time).toLocaleDateString('en-US',{weekday:'short'}):'',hour:p.sent_time?new Date(p.sent_time).getHours():null}));
    const bot5=sorted.slice(-5).map(p=>({text:(p.text||'').slice(0,100),eng:p.metrics?.engagements||0,network:p.customer_profile?.network_type}));
    const byNet={};
    posts.forEach(p=>{const n=(p.customer_profile?.network_type||'unknown').toLowerCase();if(!byNet[n])byNet[n]={t:0,c:0};byNet[n].t+=p.metrics?.engagements||0;byNet[n].c++;});
    const netSummary=Object.entries(byNet).map(([n,d])=>({network:n,avgEng:Math.round(d.t/d.c),posts:d.c}));
    const prompt=`You are a sharp INTJ - Life.Church's real social media data. Life.Church is a large multi-site church. Be direct, analytical, ruthlessly specific. No fluff. No corporate speak.\n\nData (last ${days} days):\n- ${posts.length} posts, avg ${avgEng} engagements/post\n- Platform breakdown: ${JSON.stringify(netSummary)}\n- Top 5 posts: ${JSON.stringify(top5)}\n- Bottom 5 posts: ${JSON.stringify(bot5)}\n\nReturn ONLY a JSON array with 6-8 insight objects. No markdown, no preamble, no backticks.\nSchema: [{"type":"strength|weakness|opportunity|pattern","text":"..."}]\nEach text 1-2 sentences. Be specific to what you see in the data.`;
    try {
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
      const data=await res.json();
      const text=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
      const insights=JSON.parse(text.replace(/```json|```/g,'').trim());
      document.getElementById('tab-insights').innerHTML='<div class="insights-list">'+insights.map(ins=>`<div class="insight-card"><div class="insight-type type-${ins.type}">${ins.type}</div><div class="insight-text">${ins.text}</div></div>`).join('')+'</div>';
    } catch(e) {
      document.getElementById('tab-insights').innerHTML=`<div class="insights-loading" style="color:var(--red)">Could not generate insights: ${e.message}</div>`;
    }
  }

  function switchTab(name,btn) {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+name).classList.add('active');
  }

  // Pre-fill token
  document.addEventListener('DOMContentLoaded', () => { connect(); });
</script>
