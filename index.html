function pc(r){return(r*100).toFixed(2)+'%';}

function gnet(g){if(!g)return'unknown';if(g.indexOf('igmed:')===0)return'instagram';if(g.indexOf('p:')===0)return'facebook';if(g.indexOf('li:')===0)return'linkedin';return'unknown';}
function gurl(g){if(!g)return null;if(g.indexOf('p:')===0){var p=g.slice(2).split('_');if(p.length===2)return'https://www.facebook.com/'+p[0]+'/posts/'+p[1];}return null;}
function sget(path){return fetch('/api/sprout?path='+encodeURIComponent(path),{headers:{'x-sprout-token':TOK}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function spost(path,body){return fetch('/api/sprout?path='+encodeURIComponent(path),{method:'POST',headers:{'Content-Type':'application/json','x-sprout-token':TOK},body:JSON.stringify(body)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+': '+t.slice(0,100));});return r.json();});}

var nl={instagram:'IG',fb_instagram_account:'IG',facebook:'FB',linkedin:'LI',youtube:'YT',tiktok:'TK'};
var EX=['twitter','fb_twitter_account','linkedin','youtube'];
var pp=profs.filter(function(p){return EX.indexOf((p.network_type||'').toLowerCase())===-1;});
var gr={};pp.forEach(function(p){var k=p.name||p.handle||'?';if(!gr[k])gr[k]=[];gr[k].push(p);});
window._gr=gr;window._pp=pp;window._nl=nl;selProfs=[];
var nms=Object.keys(gr),o='<option value="">-- Select account --</option><option value="all">All accounts</option>';
nms.forEach(function(n){
var ps=gr[n];
if(ps.length===1){o+='<option value="g:'+n+'">'+n+'</option>';}
else{o+='<optgroup label="'+n+'"><option value="g:'+n+'">'+n+' - All</option>';
ps.forEach(function(p){var nt=(p.network_type||'').toLowerCase();o+='<option value="p:'+p.customer_profile_id+'">'+n+' - '+(nl[nt]||nt)+'</option>';});
o+='</optgroup>';}
});

function selAcc(v){
var nl=window._nl||{},pp=window._pp||[],gr=window._gr||{},sel=[];
if(v==='all')sel=pp;
else if(v.indexOf('g:')===0)sel=gr[v.slice(2)]||[];
else if(v.indexOf('p:')===0){var id=parseInt(v.slice(2));sel=pp.filter(function(p){return p.customer_profile_id===id;});}

var h='';sel.forEach(function(p){var nt=(p.network_type||'').toLowerCase(),c=nc(nt);h+='<div class="pit on"><div class="pico" style="background:'+c+'18;color:'+c+'">'+(nl[nt]||'--')+'</div><div><div class="pnm">'+(p.name||'?')+'</div><div class="pnt">'+nt+'</div></div></div>';});

function gdr(d){var e=new Date(),s=new Date();s.setDate(s.getDate()-parseInt(d));function f(x){return x.toISOString().split('T')[0];}return{s:f(s),e:f(e)};}
function cacheKey(){return 'lc_'+selProfs.join('_')+'_'+(document.getElementById('drange')||{value:'30'}).value;}
function cacheGet(){try{var k=cacheKey(),s=sessionStorage.getItem(k);if(!s)return null;var d=JSON.parse(s);if(Date.now()-d.ts>1800000)return null;return d.posts;}catch(e){return null;}}
function cacheSet(posts){try{sessionStorage.setItem(cacheKey(),JSON.stringify({ts:Date.now(),posts:posts}));}catch(e){}}
function runAnal(){
if(!selProfs.length){alert('Please select an account first.');return;}
var btn=document.getElementById('rbtn');btn.disabled=true;btn.textContent='Running...';
var d=document.getElementById('drange').value,r=gdr(d);
var cached=cacheGet();
if(cached){
ss('From cache '+cached.length+' posts','ok');
rendM(cached);rendP(cached);rendPat(cached);rendA(cached);
document.getElementById('dash').style.display='block';
document.getElementById('emp').style.display='none';
btn.disabled=false;btn.textContent='Run Analysis';
return;
}
ss('Fetching analytics...','loading');
spost('/v1/'+cid+'/analytics/posts',{
filters:['customer_profile_id.eq('+selProfs.join(',')+')', 'created_time.in('+r.s+'..'+r.e+')'],
metrics:['lifetime.impressions','lifetime.engagements','lifetime.reactions','lifetime.shares_count','lifetime.comments_count','lifetime.video_view_time_per_view'],
page_size:100
}).then(function(res){
var posts=res.data||[];
cacheSet(posts);
ss('Analyzing '+posts.length+' posts...','loading');
rendM(posts);rendP(posts);rendPat(posts);rendA(posts);
document.getElementById('dash').style.display='block';
document.getElementById('emp').style.display='none';
ss(posts.length+' posts | '+d+' days','ok');
}).catch(function(e){ss('Error: '+e.message,'error');})
.finally(function(){btn.disabled=false;btn.textContent='Run Analysis';});
}
function rendM(posts){
var ti=0,te=0;posts.forEach(function(p){ti+=(p.metrics&&p.metrics['lifetime.impressions'])||0;te+=(p.metrics&&p.metrics['lifetime.engagements'])||0;});
var ae=posts.length?Math.round(te/posts.length):0,er=ti>0?((te/ti)*100).toFixed(2):0;
var c=[['Impressions',fn(ti)],['Engagements',fn(te)],['Avg Eng/Post',fn(ae)],['Eng Rate',er+'%'],['Posts',posts.length]];
document.getElementById('mgrid').innerHTML=c.map(function(x){return'<div class="mc"><div class="mcl">'+x[0]+'</div><div class="mcv">'+x[1]+'</div></div>';}).join('');
}

h+='<div class="pstats">';

h+='<div class="st">ENG <span>'+fn(eng)+'</span></div>';
h+='<div class="st">REACT <span>'+fn((p.metrics&&p.metrics['lifetime.reactions'])||0)+'</span></div>';
h+='<div class="st">CMT <span>'+fn((p.metrics&&p.metrics['lifetime.comments_count'])||0)+'</span></div>';

h+='<div class="st hl">ER <span>'+er+'%</span></div>';
h+='</div></div>';
});
h+='</div>';tab.innerHTML=h;
}
function rendPat(posts){
if(!posts.length)return;
function mg(k){return function(p){return(p.metrics&&p.metrics[k])||0;};}
var s=posts.slice().sort(function(a,b){return mg('lifetime.engagements')(b)-mg('lifetime.engagements')(a);});
var cut=Math.max(1,Math.floor(s.length*0.25)),top=s.slice(0,cut),bot=s.slice(-cut);
function av(arr,fn){return arr.length?arr.reduce(function(x,p){return x+fn(p);},0)/arr.length:0;}
var tE=av(top,mg('lifetime.engagements')),bE=av(bot,mg('lifetime.engagements'));
var tI=av(top,mg('lifetime.impressions')),bI=av(bot,mg('lifetime.impressions'));
var tER=tI>0?(tE/tI*100).toFixed(2):0,bER=bI>0?(bE/bI*100).toFixed(2):0;
var tS=av(top,mg('lifetime.shares_count')),bS=av(bot,mg('lifetime.shares_count'));
var tC=av(top,mg('lifetime.comments_count')),bC=av(bot,mg('lifetime.comments_count'));
var tR=av(top,mg('lifetime.reactions')),bR=av(bot,mg('lifetime.reactions'));
var bn={};
posts.forEach(function(p){
var n=gnet(p.guid);
if(!bn[n])bn[n]={t:0,i:0,r:0,s:0,c:0,n:0};
bn[n].t+=mg('lifetime.engagements')(p);bn[n].i+=mg('lifetime.impressions')(p);
bn[n].r+=mg('lifetime.reactions')(p);bn[n].s+=mg('lifetime.shares_count')(p);
bn[n].c+=mg('lifetime.comments_count')(p);bn[n].n++;
});
var ne=Object.keys(bn).map(function(k){return[k,bn[k]];}).sort(function(a,b){return(b[1].t/b[1].n)-(a[1].t/a[1].n);});
var mR=Math.max.apply(null,ne.map(function(e){return e[1].n>0?e[1].r/e[1].n:0;}).concat([1]));
var mS=Math.max.apply(null,ne.map(function(e){return e[1].n>0?e[1].s/e[1].n:0;}).concat([1]));
var mC=Math.max.apply(null,ne.map(function(e){return e[1].n>0?e[1].c/e[1].n:0;}).concat([1]));
var el=posts.map(mg('lifetime.engagements')),mE=Math.max.apply(null,el.concat([1]));
var dist=[0,0,0,0,0];el.forEach(function(e){dist[Math.min(4,Math.floor((e/mE)*5))]++;});
var mD=Math.max.apply(null,dist.concat([1]));
var sl=posts.map(mg('lifetime.shares_count')),ll=posts.map(mg('lifetime.reactions'));
var mSc=Math.max.apply(null,sl.concat([1])),mLc=Math.max.apply(null,ll.concat([1]));
var tEv=av(top,mg('lifetime.engagements')),bEv=av(bot,mg('lifetime.engagements'));
var dm=dist[0]+dist[1]>dist[3]+dist[4]?'Most posts underperform. A few outliers carry your metrics.':dist[3]+dist[4]>dist[0]+dist[1]?'Strong consistent performance. Content reliably engaging.':'Mixed results with high variance.';
var rows=[['Avg engagement',fn(Math.round(tE)),fn(Math.round(bE))],['Avg reach',fn(Math.round(tI)),fn(Math.round(bI))],['Eng rate',tER+'%',bER+'%'],['Avg shares',fn(Math.round(tS)),fn(Math.round(bS))],['Avg comments',fn(Math.round(tC)),fn(Math.round(bC))],['Avg reactions',fn(Math.round(tR)),fn(Math.round(bR))]];
var p1='<div class="pcrd"><div class="ptit">Top '+cut+' vs bottom '+cut+' posts</div><div class="pcmp"><div class="pg pg-t"><div class="pglbl">Top performers</div>';
rows.forEach(function(r){p1+='<div class="psr"><span class="psk">'+r[0]+'</span><span class="psv">'+r[1]+'</span></div>';});
p1+='</div><div class="pg pg-b"><div class="pglbl">Underperformers</div>';
rows.forEach(function(r){p1+='<div class="psr"><span class="psk">'+r[0]+'</span><span class="psv">'+r[2]+'</span></div>';});
p1+='</div></div></div>';
var p2='<div class="pcrd"><div class="ptit">Platform breakdown</div>';
ne.forEach(function(e){
var n=e[0],d=e[1],aR=d.n>0?Math.round(d.r/d.n):0,aS=d.n>0?Math.round(d.s/d.n):0,aC=d.n>0?Math.round(d.c/d.n):0;
var rp=Math.round((aR/mR)*100),sp=Math.round((aS/mS)*100),cp=Math.round((aC/mC)*100);
p2+='<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:600;color:var(--tx);margin-bottom:8px;display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:'+nc(n)+'"></div>'+n+'<span style="font-size:10px;color:var(--tx3);font-weight:400">('+d.n+' posts)</span></div>';
p2+='<div class="pbr"><div class="pbl">Reactions</div><div class="pbt"><div class="pbf" style="width:'+rp+'%;background:var(--co)"></div></div><div class="pbv">'+fn(aR)+'</div></div>';
p2+='<div class="pbr"><div class="pbl">Shares</div><div class="pbt"><div class="pbf" style="width:'+sp+'%;background:var(--gr)"></div></div><div class="pbv">'+fn(aS)+'</div></div>';
p2+='<div class="pbr"><div class="pbl">Comments</div><div class="pbt"><div class="pbf" style="width:'+cp+'%;background:var(--am)"></div></div><div class="pbv">'+fn(aC)+'</div></div></div>';
});
p2+='</div>';
var db='';dist.forEach(function(v,i){db+='<div style="flex:1;border-radius:3px 3px 0 0;background:var(--co);opacity:'+(0.35+i*0.16)+';height:'+Math.round((v/mD)*100)+'%"></div>';});
var p3='<div class="pcrd"><div class="ptit">Engagement distribution</div><div style="display:flex;align-items:flex-end;gap:4px;height:80px">'+db+'</div><div style="display:flex;gap:4px;margin-top:6px"><div style="flex:1;font-size:9px;color:var(--tx3);text-align:center">Low</div><div style="flex:1"></div><div style="flex:1;font-size:9px;color:var(--tx3);text-align:center">Mid</div><div style="flex:1"></div><div style="flex:1;font-size:9px;color:var(--tx3);text-align:center">High</div></div><div style="margin-top:12px;font-size:11px;color:var(--tx2)">'+dm+'</div></div>';
var dots='';s.slice(0,25).forEach(function(p,i){
var sv=mg('lifetime.shares_count')(p),lv=mg('lifetime.reactions')(p),ev=mg('lifetime.engagements')(p);
var x=Math.round((sv/mSc)*88+6),y=Math.round((1-(lv/mLc)*0.88)*100);
var col=ev>tEv*0.8?'var(--gr)':ev<bEv*1.2?'var(--re)':'var(--am)';
dots+='<div class="pdot" title="Post #'+(i+1)+'" style="left:'+x+'%;top:'+y+'%;background:'+col+';border:2px solid '+col+';opacity:0.85"></div>';
});
var p4='<div class="pcrd"><div class="ptit">Sends vs likes scatter</div><div class="psc">'+dots+'<div style="position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:var(--tx3)">Sends</div><div style="position:absolute;top:4px;left:4px;font-size:9px;color:var(--tx3)">Likes</div></div><div style="display:flex;gap:12px;font-size:10px;color:var(--tx3);margin-top:8px"><span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--gr);display:inline-block"></span>Top</span><span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--am);display:inline-block"></span>Avg</span><span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--re);display:inline-block"></span>Low</span></div></div>';
document.getElementById('tp-patterns').innerHTML='<div class="pgrid">'+p1+p2+p3+p4+'</div>';
}
function rendA(posts){
var ip=posts.filter(function(p){return p.guid&&p.guid.indexOf('igmed:')===0;});
aRows=ip.map(function(p,i){
var re=(p.metrics&&p.metrics['lifetime.impressions'])||0;
var se=(p.metrics&&p.metrics['lifetime.shares_count'])||0;
var li=(p.metrics&&p.metrics['lifetime.reactions'])||0;
var wr=(p.metrics&&p.metrics['lifetime.video_view_time_per_view'])||0;
var wt=wr>100?wr/1000:wr;
var sr=re>0?se/re:0,lr=re>0?li/re:0;
var sc=(sr*1000)+(lr*250)+(wt>0?Math.min(wt,60)/60*50:0);
return{i:i+1,g:p.guid,re:re,se:se,sr:sr,li:li,lr:lr,wt:wt,sc:sc};
}).filter(function(r){return r.re>0;});
var tab=document.getElementById('tp-adam');
if(!aRows.length){tab.innerHTML='<div class="emp" style="height:200px"><div class="etit">No IG posts</div><div class="esub">Select an Instagram profile</div></div>';return;}
var skeys=[['sc','Signal Score'],['sr','Sends/Reach'],['lr','Likes/Reach'],['re','Reach'],['wt','Watch Time']];
var sbh='<div class="asbr"><span style="font-size:11px;color:var(--tx3);font-weight:600">Sort:</span>';
skeys.forEach(function(k){sbh+='<button class="asbt'+(k[0]===aKey?' on':'')+'" onclick="asort(\''+k[0]+'\')">'+k[1]+'</button>';});
sbh+='</div>';
var flt='<div class="aflt"><div><select class="sel" id="atype" style="margin-bottom:0" onchange="rendAc()"><option value="">All types</option><option value="v">Video/Reel</option><option value="p">Photo</option></select></div><div><input class="sel" id="amin" type="number" placeholder="Min reach..." style="margin-bottom:0;padding:7px 10px" oninput="rendAc()"></div></div>';
var note='<div class="anote">Signal Score = Sends/reach x1000 + Likes/reach x250 + Watch time bonus up to 50pts. Stories excluded. 30+ strong, 10-30 avg, under 10 low.</div>';
var sum='<div class="astrip" id="asum"></div>';
tab.innerHTML=sum+sbh+flt+note+'<div id="acards"></div>';
rendAS();rendAc();
}
function rendAS(){
var el=document.getElementById('asum');if(!el)return;
function av(arr,fn){return arr.length?arr.reduce(function(s,r){return s+fn(r);},0)/arr.length:0;}
var as=av(aRows,function(r){return r.sr;}),al=av(aRows,function(r){return r.lr;});
var wr=aRows.filter(function(r){return r.wt>0;}),aw=av(wr,function(r){return r.wt;});
el.innerHTML=[['IG Posts',aRows.length],['Avg Sends/Reach',pc(as)],['Avg Likes/Reach',pc(al)],['Avg Watch Time',wr.length?tf(aw):'--']].map(function(c){return'<div class="ac"><div class="acl">'+c[0]+'</div><div class="acv">'+c[1]+'</div></div>';}).join('');
}
function tf(s){if(!s||s<=0)return'--';if(s<60)return s.toFixed(1)+'s';var m=Math.floor(s/60),x=Math.round(s%60);return m+':'+(x<10?'0':'')+x;}
function asort(k){
if(aKey===k)aDir=aDir==='asc'?'desc':'asc';else{aKey=k;aDir='desc';}
document.querySelectorAll('.asbt').forEach(function(b){b.classList.toggle('on',b.getAttribute('onclick').indexOf("'"+k+"'")!==-1);});

}
function rendAc(){
var c=document.getElementById('acards');if(!c)return;
var mr=parseFloat((document.getElementById('amin')&&document.getElementById('amin').value)||0)||0;
var tf2=(document.getElementById('atype')&&document.getElementById('atype').value)||'';
var d=aRows.filter(function(r){return r.re>=mr;});
if(tf2==='v')d=d.filter(function(r){return r.wt>0;});
if(tf2==='p')d=d.filter(function(r){return r.wt===0;});
d=d.slice().sort(function(a,b){return aDir==='asc'?a[aKey]-b[aKey]:b[aKey]-a[aKey];});
if(!d.length){c.innerHTML='<div style="text-align:center;padding:32px;color:var(--tx3)">No posts match filters</div>';return;}
var mx=Math.max.apply(null,d.map(function(r){return r.sc;}).concat([1]));
var h='';
d.forEach(function(r,i){
var v=r.sc>mx*0.75?'strong':r.sc>mx*0.4?'mid':'weak';
var vl=v==='strong'?'Top signal':v==='weak'?'Low signal':'Average';
var dl=138,fi=Math.round((r.sc/mx)*dl);
var sc=v==='strong'?'var(--co)':v==='weak'?'var(--tx3)':'var(--am)';
var src=r.sr>=0.01?'var(--gr)':r.sr>=0.004?'var(--am)':'var(--re)';
var lrc=r.lr>=0.04?'var(--gr)':r.lr>=0.02?'var(--am)':'var(--re)';
var url=gurl(r.g);
h+='<div class="acrd">';
h+='<div class="adw"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="var(--sur2)" stroke-width="6"/><circle cx="28" cy="28" r="22" fill="none" stroke="'+sc+'" stroke-width="6" stroke-dasharray="'+fi+' '+(dl-fi)+'" stroke-dashoffset="34" stroke-linecap="round"/><text x="28" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="'+sc+'">'+r.sc.toFixed(1)+'</text></svg><div class="adl">signal</div></div>';
h+='<div class="acm"><div class="act"><span class="actt">#'+(i+1)+' Post #'+r.i+'</span><span class="apill '+v+'">'+vl+'</span>'+(url?'<a href="'+url+'" target="_blank" class="vlink">View</a>':'')+'<span style="font-size:10px;color:var(--tx3);margin-left:auto">'+r.g.slice(0,20)+'...</span></div>';
h+='<div class="acmg">';
h+='<div class="acmi"><div class="acmil">Reach</div><div class="acmiv">'+fn(r.re)+'</div><div class="acmis">impressions</div></div>';
h+='<div class="acmi"><div class="acmil">Sends/reach</div><div class="acmiv" style="color:'+src+'">'+pc(r.sr)+'</div><div class="acmis">'+fn(r.se)+' sends</div></div>';
h+='<div class="acmi"><div class="acmil">Likes/reach</div><div class="acmiv" style="color:'+lrc+'">'+pc(r.lr)+'</div><div class="acmis">'+fn(r.li)+' likes</div></div>';
h+='</div></div></div>';
});
c.innerHTML=h;
}

function cmLoadLib(){try{var s=localStorage.getItem('cmLib');if(s)cmLib=JSON.parse(s);}catch(e){}}
function cmDelete(id){cmLib=cmLib.filter(function(x){return x.id!==id;});try{localStorage.setItem('cmLib',JSON.stringify(cmLib));}catch(e){}rendCmLib();}
function cmShareItem(id){var item=cmLib.find(function(x){return x.id===id;});if(!item)return;var txt='LC Social Intel: '+item.q+' = '+item.val+' ('+item.sub+')';if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('Copied!');});}else{alert(txt);}}
function rendCmLib(){var el=document.getElementById('cmliblist');if(!el)return;if(!cmLib.length){el.innerHTML='<div style="text-align:center;padding:28px;color:var(--tx3);font-size:12px">No saved metrics yet.</div>';return;}var h='';cmLib.forEach(function(item){h+='<div class="cmlibcard"><div class="cmlibicon">&#9650;</div><div style="flex:1;min-width:0"><div class="cmlibname">'+item.q+'</div><div class="cmlibmeta">'+item.sub+' &middot; '+item.ts+'</div></div><div class="cmlibval">'+item.val+'</div><div class="cmicobtn" onclick="cmShareItem('+item.id+')" title="Share" style="margin-right:4px">&#8594;</div><div class="cmicobtn" onclick="cmDelete('+item.id+')" title="Delete">&#215;</div></div>';});el.innerHTML=h;}
var CHIPS=['Average watch time on Reels','Posts over 10k reach this month','Best day of week for engagement','Monday afternoon IG reach','Top performing post type','Sends per reach ratio'];
function rendCm(){cmLoadLib();var el=document.getElementById('tp-custom');if(!el)return;var chips=CHIPS.map(function(c){return'<span class="cmchip" onclick="cmSetQ(this.textContent)">'+c+'</span>';}).join('');var h='<div class="cmwrap"><div style="margin-bottom:6px"><span style="font-size:9px;font-weight:700;color:var(--tx3);letter-spacing:0.12em;text-transform:uppercase">Ask a custom question</span></div><div class="cmqbox"><textarea id="cmq" rows="2" placeholder="e.g. What is our average watch time on Reels? or Posts over 10k reach this month?"></textarea><button onclick="cmRun()">Analyze &rarr;</button></div><div class="cmchips">'+chips+'</div><div id="cmresult"></div><div style="margin-top:14px"><span style="font-size:9px;font-weight:700;color:var(--tx3);letter-spacing:0.12em;text-transform:uppercase">Saved metrics library</span></div><div id="cmliblist" style="margin-top:8px"></div></div>';el.innerHTML=h;rendCmLib();}
function cmSetQ(q){var el=document.getElementById('cmq');if(el){el.value=q;el.focus();}}
function cmRun(){var q=(document.getElementById('cmq')||{}).value||'';q=q.trim();if(!q){alert('Enter a question.');return;}if(!selProfs.length){alert('Select an account first.');return;}var rel=document.getElementById('cmresult');if(!rel)return;rel.innerHTML='<div style="padding:14px 0;color:var(--tx3);font-size:12px">Analyzing...</div>';var days=parseInt((document.getElementById('drange')||{value:'30'}).value)||30;var end=new Date(),start=new Date();start.setDate(start.getDate()-days);function df(d){return d.toISOString().split('T')[0];}var pf='customer_profile_id.eq('+selProfs.join(',')+')';var tf='created_time.in('+df(start)+'..'+df(end)+')';spost('/v1/'+cid+'/analytics/posts',{filters:[pf,tf],metrics:['lifetime.impressions','lifetime.engagements','lifetime.reactions','lifetime.shares_count','lifetime.comments_count','lifetime.video_view_time_per_view'],page_size:200}).then(function(res){cmAnalyze(q,res.data||[],days);}).catch(function(e){rel.innerHTML='<div style="color:var(--re);font-size:12px">Error: '+e.message+'</div>';});}
function cmAnalyze(q,posts,days){var rel=document.getElementById('cmresult');if(!rel)return;var metrics=posts.map(function(p){var m=p.metrics||{};return {guid:p.guid,created_time:p.created_time,imp:m['lifetime.impressions']||0,eng:m['lifetime.engagements']||0,react:m['lifetime.reactions']||0,shares:m['lifetime.shares_count']||0,comments:m['lifetime.comments_count']||0,wt_ms:m['lifetime.video_view_time_per_view']||0};});var prompt='You are a social media analytics assistant. User asked: "'+q+'"\n';prompt+='Data: '+metrics.length+' posts, last '+days+' days.\n';prompt+='Fields: guid (igmed:=IG feed, p:=FB, igst:=story), created_time (ISO), imp=impressions/reach, eng=engagements, react=reactions, shares, comments, wt_ms=watch time ms (divide by 1000 for seconds, 0 if not video).\n';prompt+='Dataset (JSON):\n'+JSON.stringify(metrics.slice(0,100))+'\n';prompt+='Rules: 1) Answer directly using this data. 2) For unavailable metrics (skip rate, saves, link clicks, story completion, profile visits) say so and suggest best proxy. 3) For time queries parse created_time: new Date(x).getDay() 0=Sun,1=Mon...6=Sat, getHours() for hour. 4) Watch time in seconds = wt_ms/1000. 5) Return ONLY a JSON object: {answerable:bool, steps:[{status:"ok"/"no"/"go",title:"...",detail:"..."}], value:"main answer", valueLabel:"short label", sub:"context", insight:"2-3 sentence insight", noDataReason:"if !answerable", proxyLabel:"best proxy if !answerable"}. No markdown, no extra text.';spost('/claude',{prompt:prompt}).then(function(r){var txt=r.text||'';var clean=txt.replace(/```json|```/g,'').trim();var parsed;try{parsed=JSON.parse(clean);}catch(e){parsed=null;}if(!parsed){rel.innerHTML='<div style="color:var(--re);font-size:12px">Parse error: '+txt.slice(0,200)+'</div>';return;}cmShowResult(q,parsed);}).catch(function(e){rel.innerHTML='<div style="color:var(--re);font-size:12px">Claude error: '+e.message+'</div>';});}
function cmShowResult(q,r){
window._cmLast={q:q,r:r};
var rel=document.getElementById('cmresult');if(!rel)return;
var h='<div class="cmresult">';
if(r.steps&&r.steps.length){
r.steps.forEach(function(s){
var cls=s.status==='ok'?'ok':s.status==='no'?'no':'go';
var sym=s.status==='ok'?'&#10003;':s.status==='no'?'&#215;':'&bull;';
h+='<div class="cmstep"><div class="cmstep-dot '+cls+'">'+sym+'</div>';
h+='<div><div class="cmstep-title">'+s.title+'</div><div class="cmstep-sub">'+s.detail+'</div></div></div>';
});}
if(r.answerable&&r.value){
h+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bor)">';
h+='<div class="cmresult-q">'+q+'</div>';
h+='<div class="cmresult-val">'+r.value+'</div>';
h+='<div class="cmresult-sub">'+r.sub+'</div>';
if(r.insight)h+='<div class="cminsight">'+r.insight+'</div>';
h+='<div class="cmactions">';
h+='<button class="cmabtn primary" onclick="cmSaveLast()">&#9733; Save</button>';
h+='<button class="cmabtn" onclick="cmTeamsLast()">&#128172; Teams</button>'+'<button class="cmabtn" onclick="cmCopyLast()">&#10064; Copy</button>';
h+='<button class="cmabtn" onclick="cmRun()">&#8635; Re-run</button>';
h+='</div></div>';
}else{
h+='<div class="nodata-box"><span style="color:var(--re)">&#9888;</span><div style="font-size:11px;color:var(--tx2);margin-left:6px">'+(r.noDataReason||'Not available')+'</div></div>';
if(r.proxyLabel){
h+='<div class="proxy-box"><span style="color:var(--co)">&#8594;</span><div style="font-size:11px;color:var(--tx2);margin-left:6px">Best proxy: <strong>'+r.proxyLabel+'</strong> &mdash; <span style="color:var(--co);cursor:pointer;font-weight:600" onclick="cmSetQ(\"'+ r.proxyLabel+'\")">Ask this &rarr;</span></div></div>';
}
}
h+='</div>';
rel.innerHTML=h;
}
function cmSaveLast(){
var l=window._cmLast;if(!l)return;
cmSave(l.q,l.r.value,l.r.sub,l.r.insight||'');
alert('Saved to library!');
}
function cmCopyLast(){
var l=window._cmLast;if(!l)return;
var txt=l.q+': '+l.r.value+' ('+l.r.sub+'). '+(l.r.insight||'')+' via https://intj-lc-social-intel.vercel.app';
if(navigator.clipboard){
navigator.clipboard.writeText(txt).then(function(){alert('Copied to clipboard!');});
}else{prompt('Copy this:',txt);}
}
function cmTeamsLast(){
var l=window._cmLast;if(!l)return;
var msg=l.q+': '+l.r.value+' ('+l.r.sub+'). '+(l.r.insight||'')+' via https://intj-lc-social-intel.vercel.app';
window.open('https://teams.microsoft.com/l/chat/0/0?message='+encodeURIComponent(msg),'_blank');
}

function rendInsights(){
var el=document.getElementById('tp-insights');if(!el)return;
var h='<div class="iswrap">';
h+='<div class="issubnav">';
h+='<button class="issubbtn on" onclick="insTab(\'heatmap\',this)">Best Time Heatmap</button>';
h+='<button class="issubbtn" onclick="insTab(\'velocity\',this)">Content Velocity</button>';
h+='<button class="issubbtn" onclick="insTab(\'decay\',this)">Engagement Decay</button>';
h+='</div>';
h+='<div id="ins-heatmap" class="ispanel on"><div style="text-align:center;padding:40px;color:var(--tx3);font-size:12px">Loading heatmap...</div></div>';
h+='<div id="ins-velocity" class="ispanel"><div style="text-align:center;padding:40px;color:var(--tx3);font-size:12px">Loading velocity data...</div></div>';
h+='<div id="ins-decay" class="ispanel"><div style="text-align:center;padding:40px;color:var(--tx3);font-size:12px">Loading decay data...</div></div>';
h+='</div>';
el.innerHTML=h;
insFetch();
}
function insTab(n,b){
document.querySelectorAll('.issubbtn').forEach(function(x){x.classList.remove('on');});
document.querySelectorAll('.ispanel').forEach(function(x){x.classList.remove('on');});
b.classList.add('on');
var p=document.getElementById('ins-'+n);if(p)p.classList.add('on');
}
function insFetch(){
var useProfs=selProfs.length?selProfs:profs.filter(function(p){var n=(p.network_type||"").toLowerCase();return n.indexOf("instagram")!==-1||n.indexOf("facebook")!==-1;}).slice(0,10).map(function(p){return p.customer_profile_id;});
if(!useProfs.length){
var msg='<div style="text-align:center;padding:40px;color:var(--tx3);font-size:12px">Select an account from the sidebar first.</div>';
['ins-heatmap','ins-velocity','ins-decay'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=msg;});
return;}
var end=new Date(),start=new Date();
start.setDate(start.getDate()-90);
function df(d){return d.toISOString().split('T')[0];}
var pf='customer_profile_id.eq('+useProfs.join(',')+')',tf='created_time.in('+df(start)+'..'+df(end)+')';
['ins-heatmap','ins-velocity','ins-decay'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML='<div style="text-align:center;padding:40px;color:var(--tx3);font-size:12px">Loading 90 days of data...</div>';});
(function(){
var ck='lc_ins_'+useProfs.join('_');
var cs=null;try{var s=sessionStorage.getItem(ck);if(s){var sd=JSON.parse(s);if(Date.now()-sd.ts<1800000)cs=sd.posts;}}catch(e){}
if(cs){insRenderHeatmap(cs);insRenderVelocity(cs);insRenderDecay(cs);return;}
spost('/v1/'+cid+'/analytics/posts',{filters:[pf,tf],fields:['created_time'],metrics:['lifetime.impressions','lifetime.engagements','lifetime.reactions','lifetime.shares_count','lifetime.comments_count'],page_size:500})
.then(function(res){
var posts=(res.data||[]).filter(function(p){return p.created_time;});
insRenderHeatmap(posts);
insRenderVelocity(posts);
insRenderDecay(posts);
}).then(function(posts2){try{sessionStorage.setItem('lc_ins_'+useProfs.join('_'),JSON.stringify({ts:Date.now(),posts:posts2}));}catch(e){}}).catch(function(e){
var msg='<div style="color:var(--re);padding:20px;font-size:12px">Error: '+e.message+'</div>';
['ins-heatmap','ins-velocity','ins-decay'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=msg;});
});
})();
}
function insRenderHeatmap(posts){
var el=document.getElementById('ins-heatmap');if(!el)return;
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var grid={};for(var d=0;d<7;d++){grid[d]={};for(var h=0;h<24;h++)grid[d][h]={sum:0,count:0};}
posts.forEach(function(p){
var dt=new Date(p.created_time);
function isCtDst(d){var yr=d.getUTCFullYear();var dstStart=new Date(Date.UTC(yr,2,8));while(dstStart.getUTCDay()!==0)dstStart=new Date(dstStart.getTime()+86400000);var dstEnd=new Date(Date.UTC(yr,10,1));while(dstEnd.getUTCDay()!==0)dstEnd=new Date(dstEnd.getTime()+86400000);return d>=dstStart&&d<dstEnd;}
var ctOff=isCtDst(dt)?-5:-6;
var ctMs=dt.getTime()+(ctOff*3600000);
var ctDt=new Date(ctMs);
var day=ctDt.getUTCDay(),hr=ctDt.getUTCHours();
var imp=(p.metrics&&p.metrics['lifetime.impressions'])||0;
var eng=(p.metrics&&p.metrics['lifetime.engagements'])||0;
var score=imp>0?(eng/imp*100):0;
grid[day][hr].sum+=score;grid[day][hr].count++;
});
var vals=[];for(var d=0;d<7;d++)for(var h=0;h<24;h++){var c=grid[d][h];if(c.count>0)vals.push(c.sum/c.count);}
var maxV=vals.length?Math.max.apply(null,vals):1;
function col(v){var t=maxV>0?v/maxV:0;var r=Math.round(232*t+(240*(1-t)));var g=Math.round(114*t+(232*(1-t)));var b=Math.round(10*t+(220*(1-t)));return'rgb('+r+','+g+','+b+')';}  
var h='<div class="iscard"><div class="isctitle">Best time to post &mdash; avg engagement rate by day &amp; hour (90 days)</div>';
h+='<div class="ishmap">';
h+='<div class="ishhourlbl"></div>';
var hrLabels=['12a','1a','2a','3a','4a','5a','6a','7a','8a','9a','10a','11a','12p','1p','2p','3p','4p','5p','6p','7p','8p','9p','10p','11p'];
for(var hr=0;hr<24;hr++)h+='<div class="ishhourlbl">'+hrLabels[hr]+'</div>';
for(var d=0;d<7;d++){
h+='<div class="ishlbl">'+DAYS[d]+'</div>';
for(var hr=0;hr<24;hr++){
var c=grid[d][hr],avg=c.count?c.sum/c.count:0;
var bg=c.count?col(avg):'var(--sur2)';
var tip=c.count?DAYS[d]+' '+hrLabels[hr]+' CT: '+avg.toFixed(2)+'% ER ('+c.count+' posts)':'No data';
h+='<div class="ishcell" style="background:'+bg+'" title="'+tip+'"></div>';
}}
h+='</div>';
h+='<div class="islegend"><span class="islegtext">Low</span><div class="islegbar">';
for(var i=0;i<=8;i++)h+='<div class="islegcell" style="background:'+col(i/8*maxV)+'"></div>';
h+='</div><span class="islegtext">High ER</span></div>';
var best={day:0,hr:0,val:0};for(var d=0;d<7;d++)for(var hr=0;hr<24;hr++){var c=grid[d][hr],avg=c.count?c.sum/c.count:0;if(avg>best.val&&c.count>=2)best={day:d,hr:hr,val:avg,count:c.count};}
if(best.val>0)h+='<div class="isinsight">Your best performing slot is <strong>'+DAYS[best.day]+' at '+hrLabels[best.hr]+' CT</strong> with an average engagement rate of '+best.val.toFixed(2)+'% across '+best.count+' posts. Posts in this window consistently outperform other time slots based on your last 90 days of data.</div>';
h+='</div>';
el.innerHTML=h;
}
function insRenderVelocity(posts){
var el=document.getElementById('ins-velocity');if(!el)return;
var weeks={};
posts.forEach(function(p){
var dt=new Date(p.created_time);
var wk=dt.getFullYear()+'-W'+Math.ceil(((dt-new Date(dt.getFullYear(),0,1))/86400000+1)/7);
if(!weeks[wk])weeks[wk]={count:0,imp:0,eng:0,label:wk};
weeks[wk].count++;
weeks[wk].imp+=(p.metrics&&p.metrics['lifetime.impressions'])||0;
weeks[wk].eng+=(p.metrics&&p.metrics['lifetime.engagements'])||0;
});
var wlist=Object.keys(weeks).sort().map(function(k){return weeks[k];});
if(wlist.length<2){el.innerHTML='<div class="iscard"><div class="isinsight">Not enough weekly data to show velocity trends.</div></div>';return;}
var buckets={1:[],2:[],3:[],4:[],5:[],'6+':[]};
wlist.forEach(function(w){
var avgImp=w.count?w.imp/w.count:0;
var bk=w.count>=6?'6+':String(w.count);
if(!buckets[bk])buckets[bk]=[];
buckets[bk].push(avgImp);
});
function bavg(arr){return arr.length?arr.reduce(function(a,b){return a+b;},0)/arr.length:0;}
var bkeys=['1','2','3','4','5','6+'];
var bdata=bkeys.map(function(k){return{k:k,avg:bavg(buckets[k]||[]),n:(buckets[k]||[]).length};});
var maxAvg=Math.max.apply(null,bdata.map(function(b){return b.avg;}));
if(!maxAvg)maxAvg=1;
var h='<div class="iscard"><div class="isctitle">Content velocity &mdash; posts per week vs avg reach per post</div>';
h+='<div class="isvchart">';
bdata.forEach(function(b){
var pct=Math.round((b.avg/maxAvg)*100);
var op=b.n?1:0.2;
h+='<div class="isvbar"><div class="isvbfill" style="height:'+pct+'%;opacity:'+op+'"></div><div class="isvblbl">'+b.k+'</div></div>';
});
h+='</div><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-size:10px;color:var(--tx3)">Posts per week</span><span style="font-size:10px;color:var(--tx3)">Avg reach per post</span></div>';
var best=bdata.filter(function(b){return b.n>0;}).sort(function(a,b){return b.avg-a.avg;})[0];
var total=wlist.reduce(function(s,w){return s+w.count;},0);
var avgPerWk=(total/wlist.length).toFixed(1);
h+='<div class="isgrid">';
h+='<div class="isstatcard"><div class="isstatl">Avg posts/week</div><div class="isstatv">'+avgPerWk+'</div></div>';
h+='<div class="isstatcard"><div class="isstatl">Total weeks</div><div class="isstatv">'+wlist.length+'</div></div>';
h+='<div class="isstatcard"><div class="isstatl">Sweet spot</div><div class="isstatv">'+( best?best.k:'--')+' posts</div></div>';
h+='</div>';
if(best)h+='<div class="isinsight">Weeks with <strong>'+best.k+' posts</strong> produce the highest average reach per post ('+fn(Math.round(best.avg))+' avg impressions). Posting more than this tends to dilute per-post reach, while posting less leaves audience engagement on the table.</div>';
h+='</div>';
el.innerHTML=h;
}
function insRenderDecay(posts){
var el=document.getElementById('ins-decay');if(!el)return;
var now=Date.now();
var buckets=[{label:'0-7d',min:0,max:7},{label:'8-14d',min:7,max:14},{label:'15-21d',min:14,max:21},{label:'22-30d',min:21,max:30},{label:'31-45d',min:30,max:45},{label:'46-60d',min:45,max:60},{label:'61-90d',min:60,max:90}];
var data=buckets.map(function(b){
var ps=posts.filter(function(p){
var ageDays=(now-new Date(p.created_time))/86400000;
return ageDays>=b.min&&ageDays<b.max;
});
var avgEng=ps.length?ps.reduce(function(s,p){return s+((p.metrics&&p.metrics['lifetime.engagements'])||0);},0)/ps.length:0;
var avgImp=ps.length?ps.reduce(function(s,p){return s+((p.metrics&&p.metrics['lifetime.impressions'])||0);},0)/ps.length:0;
return{label:b.label,avgEng:avgEng,avgImp:avgImp,count:ps.length};
});
var maxEng=Math.max.apply(null,data.map(function(d){return d.avgEng;}));
if(!maxEng)maxEng=1;
var h='<div class="iscard"><div class="isctitle">Engagement decay &mdash; avg engagements by post age</div>';
h+='<div class="isvchart">';
data.forEach(function(b){
var pct=Math.round((b.avgEng/maxEng)*100);
var op=b.count?1:0.2;
var col=pct>70?'var(--gr)':pct>40?'var(--co)':'var(--tx3)';
h+='<div class="isvbar"><div class="isvbfill" style="height:'+pct+'%;opacity:'+op+';background:'+col+'"></div><div class="isvblbl">'+b.label+'</div></div>';
});
h+='</div>';
h+='<div class="isgrid">';
var fresh=data[0],old=data[data.length-1];
var decay=fresh.avgEng>0?Math.round((1-old.avgEng/fresh.avgEng)*100):0;
var peak=data.filter(function(d){return d.count>0;}).sort(function(a,b){return b.avgEng-a.avgEng;})[0];
h+='<div class="isstatcard"><div class="isstatl">0-7 day avg eng</div><div class="isstatv">'+fn(Math.round(fresh.avgEng))+'</div></div>';
h+='<div class="isstatcard"><div class="isstatl">Peak window</div><div class="isstatv">'+( peak?peak.label:'--')+'</div></div>';
h+='<div class="isstatcard"><div class="isstatl">90-day decay</div><div class="isstatv">'+decay+'%</div></div>';
h+='</div>';
h+='<div class="isinsight">Posts aged 0-7 days average '+fn(Math.round(fresh.avgEng))+' engagements. ';
if(peak&&peak.label!=='0-7d')h+='Interestingly, your peak engagement window is '+peak.label+' &mdash; suggesting your content continues to gain traction after publishing. ';
else h+='Engagement drops sharply after the first week, so early response and sharing is critical. ';
h+='By 90 days, engagements have declined '+decay+'% from the first week baseline.</div>';
h+='</div>';
el.innerHTML=h;
}

sget('/v1/metadata/client').then(function(d){
cid=d.data&&d.data[0]?String(d.data[0].customer_id):'528985';
return sget('/v1/'+cid+'/metadata/customer');
}).then(function(d){
profs=d.data||[];renderSB();ss(profs.length+' profiles loaded','ok');
